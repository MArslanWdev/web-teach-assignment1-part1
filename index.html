<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stripe-inspired</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand">stripe</div>
          <nav class="main-nav" aria-label="Main navigation">
            <a href="#">Products <span class="caret">▼</span></a>
            <a href="#">Solutions <span class="caret">▼</span></a>
            <a href="#">Developers <span class="caret">▼</span></a>
            <a href="#">Resources <span class="caret">▼</span></a>
            <a href="#">Pricing</a>
          </nav>
        </div>

        <div class="nav-utility">
          <div class="guide">
            <span class="icon">✦</span>
            <span>Guide me</span>
          </div>

          <button class="btn btn-light">Sign in</button>
          <button class="btn btn-primary">Contact sales <span>›</span></button>
        </div>
      </header>

      <main class="hero">
        <div class="hero-copy">
          <p class="eyebrow">
            Global GDP running on Stripe:
            <span>1.73160644%</span>
          </p>

          <h1>
            <strong>Financial infrastructure to grow your revenue.<strong />
            <strong>Accept payments, handle business banking and
            implement custom revenue models—from your
            first transaction to your billionth.</strong>
          </h1>

          <div class="google-container">
            <button class="btn btn-primary large">Get started <span>></span></button>
            <button class="btn btn-outline large google-btn">
              <span class="google-mark">G</span>
              <span>Sign up with Google</span>
            </button>
          </div>
        </div>

        <div class="hero-art" >
          <div class="shape shape-a"></div>
          <div class="shape shape-b"></div>
          <div class="shape shape-c"></div>
          <div class="shape shape-d"></div>
        </div>
      </main>
    </div>
  </body>
</html>
